{% extends "base.html" %}
{% block title %}Sessiyalar{% endblock %}
{% block topbar_title %}Sessiyalar{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Sessiyalar</h1><p class="muted">Barcha darslar, davomat oynalari va hisobotlar</p></div>
</div>
<div class="card flush">
  <div class="card-head">
    <h2>Roʻyxat</h2><span class="muted">{{ sessions|length }} ta</span>
    <span class="spacer"></span>
    <form method="get" class="row">
      <select name="status" onchange="this.form.submit()" aria-label="Holat boʻyicha filtr">
        <option value="">Barcha holatlar</option>
        {% for v, l in statuses %}<option value="{{ v }}" {% if v == status %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select>
    </form>
  </div>
  {% include "sessions/_table.html" with bare=1 %}
</div>
{% endblock %}
